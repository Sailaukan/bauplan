    const max = top.length ? top[0].spend : 1;
    const bar = (frac, color) => `<span class="bar" style="width:calc((100% - 200px) * ${r(frac * 1000) / 1000});background:${color}"></span>`;
    const blocks = f => f.blocks.map(n => `<span class="blk">${n ? String(n).padStart(2, '0') : '·'}</span>`).join('');
    const spendRows = top.map(f => `<li class="${dim(f.title).trim()}" ${tip(f.feature, fmtUSD(f.spend), [
      ...(f.earlier ? [['Measured on', f.st.model], ['Code calls now', f.title]] : [['Model', f.title]]), ['Calls', fmtInt(f.st.calls || 0)], ['Each', f.st.cost_usd != null ? `$${Number(f.st.cost_usd).toFixed(4)}` : '—'],
      ['Tokens', f.st.in_tokens != null ? `${fmtInt(f.st.in_tokens)} in / ${fmtInt(f.st.out_tokens || 0)} out` : '—'], ['Share', pct(f.spend, total)], ['Since', fmtDay(f.st.since)]])}>`
      + `<span class="lbl">${blocks(f)}<code title="${esc(f.feature)}">${esc(f.feature)}</code></span>`
      + `<span class="track">${bar(f.spend / max, paint(f))}<span class="val"><b>${fmtUSD(f.spend)}</b> · ${pct(f.spend, total)}${f.earlier ? ` · <span class="earlier" title="Measured on ${esc(f.st.model)}">${esc(f.st.model)}</span>` : ''}</span></span></li>`).join('');
    const restSpend = rest.reduce((a, f) => a + f.spend, 0);
    const restRow = rest.length ? `<li ${tip(`${rest.length} more`, fmtUSD(restSpend), rest.map(f => [f.feature, fmtUSD(f.spend)]))}>`
      + `<span class="lbl rest">${rest.length} more</span><span class="track">${bar(restSpend / max, 'var(--m0)')}<span class="val"><b>${fmtUSD(restSpend)}</b> · ${pct(restSpend, total)}</span></span></li>` : '';
    const free = feats.filter(f => !f.spend).length;
    const spendChart = `<figure class="viz"><h3>Where the spend goes<small>Logged calls × average cost, per logged feature, since each was first logged</small></h3>`
      + `<ol class="hbars">${spendRows}${restRow}</ol>`
      + (free ? `<p class="viz-note">${plural(free, 'feature')} logged at no cost.</p>` : '')
      + `</figure>`;

    // How spend and calls split by model: two bars of the same total, so a model's cost per call shows as the gap.
    const sum = (fs, more) => ({ spend: fs.reduce((a, f) => a + f.spend, 0), calls: fs.reduce((a, f) => a + (f.st.calls || 0), 0), logged: fs.length > 0, ...more });
    const byModel = modelOrder.map(title => sum(feats.filter(f => f.title === title && !f.earlier), { title, color: colorOf(title) }));
    // Spend logged on models the code no longer calls, in one grey group after the models it calls now.
    const old = feats.filter(f => f.earlier);
    if (old.length) byModel.push(sum(old, { title: 'Earlier models', color: 'var(--m0)', old: [...new Set(old.map(f => f.st.model))] }));
    const callsTotal = byModel.reduce((a, m) => a + m.calls, 0);
    const spendTotal = byModel.reduce((a, m) => a + m.spend, 0);
    const stack = (key, whole, fmt) => `<div class="stack">${byModel.filter(m => m[key] > 0).map(m => `<i class="${dim(m.title).trim()}" style="flex:${m[key]} 1 0;background:${m.color}" ${tip(m.title, fmt(m[key]), [['Share', pct(m[key], whole)], ...(m.old ? [['Logged on', m.old.join(', ')]] : [])])}></i>`).join('')}</div>`;
    const missing = modelOrder.filter(t => !feats.some(f => f.title === t));
    const shareChart = `<figure class="viz"><h3>By model<small>Share of logged spend and of logged calls</small></h3>`
      + `<div class="shares"><div class="share"><span>Spend · ${fmtUSD(spendTotal)}</span>${stack('spend', spendTotal, fmtUSD)}</div>`
      + `<div class="share"><span>Calls · ${fmtCount(callsTotal)}</span>${stack('calls', callsTotal, fmtInt)}</div></div>`
      + `<table class="mlist"><thead><tr><th>Model</th><th>Spend</th><th>Calls</th></tr></thead><tbody>`
      + byModel.filter(m => m.logged).map(m => `<tr${m.old ? ` title="${esc(m.old.join(', '))}"` : ` data-model="${esc(m.title)}"`} class="${m.old ? '' : dim(m.title).trim()}"><td><i class="sw" style="background:${m.color}"></i>${esc(m.title)}</td>`
        + `<td class="num">${fmtUSD(m.spend)} · ${pct(m.spend, spendTotal)}</td><td class="num">${fmtCount(m.calls)} · ${pct(m.calls, callsTotal)}</td></tr>`).join('')
      + `</tbody></table>`
      + (old.length ? `<p class="viz-note">Earlier models: ${esc(byModel[byModel.length - 1].old.join(', '))}. Spend logged before the code switched to the model it calls now.</p>` : '')
      + (missing.length ? `<p class="viz-note">Not in the usage log: ${esc(missing.join(', '))}.</p>` : '')
      + `</figure>`;
    charts = `<div class="viz-row">${spendChart}${shareChart}</div>`;
  }

  // The list: every call site by unit of work; each number has a small bar against the largest in its column.
  const groups = {};
  shown.forEach(g => { const unit = g.fx.unit || 'other'; (groups[unit] || (groups[unit] = [])).push(g); });
  const maxOf = key => Math.max(0, ...feats.map(f => Number(f.st[key]) || 0));
  const maxIn = maxOf('in_tokens'), maxCost = maxOf('cost_usd'), maxMs = maxOf('ms_p50');
  const num = (label, value, frac, cls = '') => `<span class="${cls}"><span><i>${label}</i>${value}</span>`
    + (frac != null ? `<span class="meter"><b style="width:${r(Math.max(frac, 0.01) * 100)}%"></b></span>` : '') + `</span>`;
  const row = g => {
    const st = g.fx.feature && STATS[g.fx.feature];
    const earlier = st && st.model && g.fx.model && !sameModel(st.model, g.fx.model);
    const run = runCalls && g.fx.feature ? runCalls[g.fx.feature] : null;
    const nums = [
      num('tokens', st && st.in_tokens != null ? `${fmtInt(st.in_tokens)} / ${fmtInt(st.out_tokens || 0)}` : '—', st && maxIn ? (st.in_tokens || 0) / maxIn : null),
      num('cost', st && st.cost_usd != null ? `$${Number(st.cost_usd).toFixed(4)}` : '—', st && maxCost ? (st.cost_usd || 0) / maxCost : null),
      num('time', st && st.ms_p50 != null ? `${(st.ms_p50 / 1000).toFixed(1)} s` : '—', st && maxMs ? (st.ms_p50 || 0) / maxMs : null),
      ...(runCalls ? [num('this run', run ? `${fmtInt(run.count)}× · $${Number(run.cost_usd || 0).toFixed(4)}` : 'not called', null, 'run')] : []),
    ].join('');
    const meta = [
      g.fx.times ? `<span><em>Runs</em>${esc(g.fx.times)}</span>` : '',
      g.fx.threshold ? `<span><em>Rule</em>${esc(g.fx.threshold)}</span>` : '',
    ].join('');
    const block = SPEC.nodes[g.node].num ? String(SPEC.nodes[g.node].num).padStart(2, '0') : '·';
    return `<li class="call" data-card="${esc(g.fxId)}" tabindex="0" role="button" aria-label="${esc(`${g.fx.title} ${g.fx.feature || ''}: show details`)}">`
      + `<span class="blk" title="${esc(blockLabel(g.node))}">${block}</span>`
      + `<div class="what"><div class="l1">${sw(g.fx.title)}<b>${esc(g.fx.title)}</b>${g.fx.feature ? `<code>${esc(g.fx.feature)}</code>` : ''}`
      + `${earlier ? `<span class="earlier" title="Usage measured on ${esc(st.model)}">earlier model</span>` : ''}</div>`
      + (meta ? `<div class="l2">${meta}</div>` : '')
      + `<p class="l3" title="${esc(rowLabel(g.row))}">${esc(rowLabel(g.row))}</p></div>`
      + `<div class="nums">${nums}</div></li>`;
  };
  const cols = `<div class="cols"><span>Tokens in / out</span><span>Cost</span><span>Median</span>${runCalls ? '<span>This run</span>' : ''}</div>`;
  const filter = Object.keys(models).length > 1
    ? `<div class="msum"><span class="glabel">Model</span><span class="chips" role="group" aria-label="Show calls to one model">`
      + `<button type="button" data-model="" aria-pressed="${!modelFilter}">All · ${all.length}</button>`
      + Object.entries(models).sort((a, b) => b[1] - a[1]).map(([m, n]) => `<button type="button" data-model="${esc(m)}" aria-pressed="${modelFilter === m}">${sw(m)}${esc(m)} · ${n}</button>`).join('')
      + `</span></div>`
    : '';
  return `<p>Every place the agent calls a model, by the unit of work it runs for. Numbers come from your usage log; click a call for its prompt and output schema.</p>`
    + filter
    + `<div class="kpis">${tiles}</div>`
    + (feats.length ? charts : `<p>No usage numbers yet. Write <code>stats.json</code> beside the workflow to see calls, spend, tokens and time here.</p>`)
    + Object.entries(groups).map(([unit, items]) => `<section class="unit${runCalls ? ' withrun' : ''}"><header><h3>For each ${esc(unit)}<small>${items.length} call${items.length === 1 ? '' : 's'}</small></h3>${cols}</header>`
      + `<ol class="calls">${items.map(row).join('')}</ol></section>`).join('');
}

function buildRisksPage() {
  return `<p>Problems noticed while tracing the code. Each one also sits on its row in the detailed view; click a step to open its code.</p>`
    + `<div class="tablewrap"><table><thead><tr><th>Block</th><th>Step</th><th>Risk</th></tr></thead><tbody>`
    + RISKS.map(item => {
      const href = codeLink(item.row.at, item.key);
      const step = href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(rowLabel(item.row))}</a>` : esc(rowLabel(item.row));
      return `<tr><td>${esc(blockLabel(item.node))}</td><td class="mono">${step}</td><td>${esc(item.text)}</td></tr>`;
    }).join('')
    + `</tbody></table></div>`;
}

// ── Markdown for a coding agent ─────────────────────────────────────────────
// The overview as a Mermaid flowchart; each block as a nested list of its steps in the order the code runs, with
// every call out and the file and line each step is at, written from the repository root.
const fromRoot = (root, path) => [root, path].filter(Boolean).join('/');
function fxText(fx) {
  const sets = Object.entries(fx.sets || {}).map(([k, v]) => `${k} → ${Array.isArray(v) ? v.join(' or ') : v}`).join(', ');
  const fallbacks = [].concat(fx.fallbacks || []).join(', ');
  return [
    `${fx.tag} ${fx.title}${fx.model ? ` (\`${fx.model}\`)` : ''}`,
    (fx.method || fx.endpoint) && `\`${`${fx.method || ''} ${fx.endpoint || ''}`.trim()}\``,
    fx.prompt && (fx.prompt === 'inline' ? 'prompt built in the code' : `prompt \`${fromRoot(SPEC.repo.prompts_root ?? 'prompts', fx.prompt)}\``),
    fx.schema && `output ${[fx.schema.name, (fx.schema.fields || []).join('; ')].filter(Boolean).join(': ')}`,
    fx.times && `runs ${fx.times} per ${fx.unit || 'run'}`,
    fx.threshold && `rule: ${fx.threshold}`,
    fallbacks && `falls back to ${fallbacks}`,
    fx.feature && `logged as \`${fx.feature}\``,
    (fx.fields || []).length && `fields: ${fx.fields.join(', ')}`,
    sets && `sets ${sets}`,
    fx.text,
    fx.in && `sends: ${fx.in}`,
    fx.out && `gets back: ${fx.out}`,
  ].filter(Boolean).join(' · ');
}
function rowsText(rows, depth, out) {
  const pad = '  '.repeat(depth);
  const off = (fail, side) => (fail ? ' (on failure)' : side ? ' (off the main path)' : '');
  const branch = (label, sub) => { out.push(`${pad}  - ${label}:`); rowsText(sub, depth + 2, out); };
  (rows || []).forEach(row => {
    // `then` is the outcome of a branch with no rows of its own, so it carries that branch's mark.
    const bare = field => field && !(row[field] || []).length;
    const head = {
      task: `Queued task \`${row.name}\``,
      fn: `\`${row.fn}\`${row.returns ? ` → ${row.returns}` : ''}`,
      do: row.title,
      if: `If: ${row.cond}`,
      switch: `Switch: ${row.on}`,
      each: loopText(row),
      end: `→ ${row.text}`,
    }[row.t];
    out.push(pad + '- ' + [
      head,
      row.at && `\`${fromRoot(SPEC.repo.code_root, row.at)}\``,
      row.decided_by === 'model' && 'decided by the model',
      row.then && `→ ${row.then}${off(bare(row.fail), bare(row.side))}`,
      row.note,
      row.retries && `retries: ${row.retries}`,
      row.lock && `lock: ${row.lock}`,
      row.parallel && `parallel: ${row.parallel}`,
      ...(row.risks || []).map(risk => `RISK: ${risk}`),
    ].filter(Boolean).join(' · '));
    (row.fx || []).forEach(fx => out.push(`${pad}  - ${fxText(fx)}`));
    [['yes', 'If yes'], ['no', 'If no']].forEach(([field, label]) => {
      if ((row[field] || []).length) branch(label + off(row.fail === field, row.side === field), row[field]);
    });
    (row.cases || []).forEach(c => branch(`When ${c.when}${off(c.fail, c.side)}`, c.rows));
    rowsText(row.calls, depth + 1, out);
  });
  return out;
}
function blockText(id) {
  const n = SPEC.nodes[id], band = SPEC.bands[NODE_BAND[id]];
  const out = [`## ${blockLabel(id)}`, ''];
  if (band) out.push(`${band.title}.${band.note ? ` ${band.note}` : ''}`);
  if (n.file) out.push(`File: \`${fromRoot(SPEC.repo.code_root, n.file)}\``);
  if (n.note) out.push(n.note);
  if ((n.items || []).length) out.push('', ...n.items.map(([tag, text]) => `- ${tag}: ${text}`));
  if (n.detail) out.push('', 'Steps, in the order the code runs:', ...rowsText(n.detail, 0, []));
  if (n.handoff) out.push('', `Hands on: ${n.handoff.data}${n.handoff.state ? `; ${n.handoff.state}` : ''}`);
  return out.join('\n');
}
const bandIds = band => [...band.main, ...(band.side || []).map(sd => sd.id)].filter(id => SPEC.nodes[id]);
// The whole workflow, or with a band index only that band: its chart, where it comes from and goes on to, its blocks.
function workflowText(only) {
  const d = SPEC.drawn_at || {};
  const label = s => `"${String(s).replace(/"/g, '#quot;')}"`;
  const mid = id => `n_${id.replace(/\W/g, '_')}`;
  const shape = id => ({ decision: `{${label(blockLabel(id))}}`, trigger: `([${label(blockLabel(id))}])` }[SPEC.nodes[id].kind] || `[${label(blockLabel(id))}]`);
  const bands = only == null ? SPEC.bands.map((band, i) => [band, i]) : [[SPEC.bands[only], only]];
  const inside = new Set(bands.flatMap(([band]) => bandIds(band)));
  const chart = ['flowchart LR'];
  bands.forEach(([band, i]) => chart.push(`  subgraph band${i}[${label(band.title)}]`, ...bandIds(band).map(id => `    ${mid(id)}${shape(id)}`), '  end'));
  SPEC.edges.filter(e => inside.has(e.from) && inside.has(e.to))
    .forEach(e => chart.push(`  ${mid(e.from)} ${e.dashed ? '-.->' : '-->'}${e.label ? `|${label(e.label)}|` : ''} ${mid(e.to)}`));
  const across = (edges, end) => edges.map(e => `${blockLabel(e[end])}${e.label ? ` (${e.label})` : ''}`).join('; ');
  const from = across(SPEC.edges.filter(e => inside.has(e.to) && !inside.has(e.from) && SPEC.nodes[e.from]), 'from');
  const to = across(SPEC.edges.filter(e => inside.has(e.from) && !inside.has(e.to) && SPEC.nodes[e.to]), 'to');
  const blocks = [...inside].filter(id => SPEC.nodes[id].detail || (SPEC.nodes[id].items || []).length);
  const band = only == null ? null : SPEC.bands[only];
  return [
    band ? `# ${SPEC.title}: ${band.title}` : `# ${SPEC.title}`, '',
    ...(band && band.note ? [band.note, ''] : []),
    `Traced at commit ${d.commit || '?'}${d.date ? `, ${d.date}` : ''}. Paths are from the repository root.`, '',
    ...(from ? [`Comes from: ${from}.`] : []),
    ...(to ? [`Goes on to: ${to}.`] : []),
    ...(from || to ? [''] : []),
    '```mermaid', ...chart, '```',
    ...blocks.map(id => `\n${blockText(id)}`),
  ].join('\n');
}

// ── Card drawer ─────────────────────────────────────────────────────────────
function cardHTML(fxId) {
  const item = FX[fxId];
  if (!item) return '';
  const { fx, row, node, key } = item;
  const dl = [];
  const add = (k, v) => { if (v != null && v !== '' && !(Array.isArray(v) && !v.length)) dl.push(`<dt>${esc(k)}</dt><dd>${v}</dd>`); };
  add('Model', fx.model ? `<span class="mono">${esc(fx.model)}</span>` : '');
  add('Falls back to', [].concat(fx.fallbacks || []).map(m => `<span class="mono">${esc(m)}</span>`).join(', '));
  add('Request', fx.method || fx.endpoint ? `<span class="mono">${esc(`${fx.method || ''} ${fx.endpoint || ''}`.trim())}</span>` : '');
  add('Runs', fx.times ? `${esc(fx.times)} per ${esc(fx.unit || 'run')}` : '');
  add('Rule on the answer', fx.threshold ? esc(fx.threshold) : '');
  add('Logged as', fx.feature ? `<span class="mono">${esc(fx.feature)}</span>` : '');
  add('What', fx.text ? esc(fx.text) : '');
  add('Fields', (fx.fields || []).length ? `<span class="mono">${esc(fx.fields.join(', '))}</span>` : '');
  add('Sets', fx.sets ? `<span class="mono">${esc(Object.entries(fx.sets).map(([k, v]) => `${k} → ${Array.isArray(v) ? v.join(' or ') : v}`).join(', '))}</span>` : '');
  add('Sends', fx.in ? esc(fx.in) : '');
  add('Gets back', fx.out ? esc(fx.out) : '');
  const run = example() && (example().fx || {})[fxId];
  if (run) {
    add('This run sent', run.in ? esc(run.in) : '');
    add('This run got', run.out ? esc(run.out) : '');
    add('This run', run.note ? esc(run.note) : '');
  }
  const s = fx.feature && STATS[fx.feature];
  if (s) {
    const on = s.model && fx.model && !sameModel(s.model, fx.model) ?` Measured on ${esc(s.model)}, an earlier model.` : '';
    add('Usage', `${fmtInt(s.calls || 0)} calls since ${esc(s.since || '?')}: about ${fmtInt(s.in_tokens || 0)} tokens in and ${fmtInt(s.out_tokens || 0)} out per call`
      + `${s.cost_usd != null ? `, $${Number(s.cost_usd).toFixed(4)} each` : ''}${s.ms_p50 != null ? `, median ${(s.ms_p50 / 1000).toFixed(1)} s` : ''}.${on}`);
  }
  const href = codeLink(row.at, key);
  add('Called from', `${esc(blockLabel(node))}<br><span class="mono">${esc(rowLabel(row))}</span>`
    + (row.at ? `<br>${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(row.at)}</a>` : `<span class="mono">${esc(row.at)}</span>`}` : ''));
  let extra = '';
  if (fx.schema) {
    extra += `<h3>Output schema: ${esc(fx.schema.name || '')}</h3><ul>${(fx.schema.fields || []).map(f => `<li class="mono">${esc(f)}</li>`).join('')}</ul>`;
  }
  if (fx.prompt) {
    const text = PROMPTS[fx.prompt];
    const missing = (CHECK.prompts || {})[fx.prompt] === 'missing';
    extra += `<h3>Prompt: <span class="mono">${esc(fx.prompt)}</span></h3>`
      + (fx.prompt === 'inline' ? '<p>Built in the code at the call site.</p>'
        : missing ? '<p>This prompt file was not found.</p>'
        : text ? `<pre>${esc(text)}</pre>` : '<p>Not embedded.</p>');
  }
  return `<div class="top"><span class="tag ${fx.tag}">${fx.tag}</span><h2>${esc(fx.title)}</h2><button class="plain" type="button" id="card-close">Close</button></div>`
    + `<dl>${dl.join('')}</dl>${extra}`;
}
let lastFocus = null;
function openCard(fxId) {
  const card = document.getElementById('card');
  lastFocus = document.activeElement;
  card.innerHTML = cardHTML(fxId);
  card.hidden = false;
  document.getElementById('card-close').addEventListener('click', closeCard);
  document.getElementById('card-close').focus();
}
function closeCard() {
  document.getElementById('card').hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('card').hidden) closeCard(); });
// Popovers (status, legend) close on Escape or a click elsewhere.
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('details.pop[open]').forEach(d => d.removeAttribute('open')); });
document.addEventListener('click', e => { document.querySelectorAll('details.pop[open]').forEach(d => { if (!d.contains(e.target)) d.removeAttribute('open'); }); });

// ── Page ────────────────────────────────────────────────────────────────────
function metaLine() {
  const d = SPEC.drawn_at || {};
  return `Traced at commit ${d.commit || '?'}, ${d.date || ''}. File paths are under ${SPEC.repo.code_root}/.`;
}
// The status chip says in a few words whether the diagram still matches the code; its panel has the details.
function syncChip() {
  const s = CHECK.summary;
  if (!s) return { cls: 'none', html: 'Not checked against the code' };
  const commit = `<code>${esc(String(s.head).split(' ')[0])}</code>`;
  const changed = (s.changed_blocks || []).length;
  if (s.counts.missing) return { cls: 'bad', html: `${s.counts.missing} row${s.counts.missing === 1 ? '' : 's'} not found ${commit}` };
  if (changed) return { cls: 'warn', html: `${changed} block${changed === 1 ? '' : 's'} changed since drawn ${commit}` };
  if (s.counts.moved) return { cls: 'warn', html: `${s.counts.moved} row${s.counts.moved === 1 ? '' : 's'} moved ${commit}` };
  return { cls: '', html: `In sync with the code ${commit}` };
}
function syncPanel() {
  const s = CHECK.summary;
  const d = SPEC.drawn_at || {};
  const rows = [];
  const add = (k, v) => rows.push(`<dt>${esc(k)}</dt><dd>${v}</dd>`);
  if (!s) {
    add('Checked', 'Not yet. Run <code>bauplan.py check</code> beside the code.');
  } else {
    add('Checked', `${esc(s.checked_at)}, at <code>${esc(s.head)}</code>`);
    const counts = [`${s.counts.ok} found`];
    if (s.counts.moved) counts.push(`<span class="warn">${s.counts.moved} moved</span>`);
    if (s.counts.missing) counts.push(`<span class="bad">${s.counts.missing} not found</span>`);
    if (s.counts.unchecked) counts.push(`${s.counts.unchecked} without a line to check`);
    add('Rows', counts.join(' · '));
    const changed = s.changed_blocks || [];
    add('Changed since drawn', changed.length ? `<span class="warn">${esc(changed.map(blockLabel).join(', '))}</span>` : 'nothing');
    if ((s.prompts_missing || []).length) add('Missing prompts', `<span class="bad">${esc(s.prompts_missing.join(', '))}</span>`);
    Object.entries(s.examples_stale || {}).forEach(([id, keys]) => {
      const item = EXAMPLES.find(e => e.id === id);
      add('Stale example', `<span class="warn">${esc(item ? item.name : id)}: ${keys.length} step${keys.length === 1 ? '' : 's'} no longer in the diagram</span>`);
    });
  }
  add('Drawn at', `<code>${esc(d.commit || '?')}</code>${d.date ? `, ${esc(d.date)}` : ''}`);
  add('Code', `paths are under <code>${esc(SPEC.repo.code_root || '.')}/</code>`);
  return `<dl>${rows.join('')}</dl><p class="made">Drawn with <a href="https://github.com/Sailaukan/bauplan" target="_blank" rel="noopener">Bauplan</a>.</p>`;
}

const CAPTIONS = {
  overview: 'Click a block to open its functions.',
  detailed: 'Rows run in the order the code runs; an indented row is called from, or runs inside, the row above. Click a function to open its code, or a call for its prompt, schema and usage.',
};
// #detailed, #data and #models open a view; #<node id> opens that block's details, so a block can be linked.
const HASH = location.hash.slice(1);
const HASH_BLOCK = SPEC.nodes[HASH] && SPEC.nodes[HASH].detail ? HASH : '';
const VIEWS = ['overview', 'detailed', 'data', 'models', 'risks'];
let view = VIEWS.includes(HASH) ? HASH : HASH_BLOCK ? 'detailed' : 'overview';
let only = HASH_BLOCK;
let pathsShown = 'all';
let highlight = { kind: '', find: '' };

function applyHighlight() {
  const svg = document.querySelector('#diagram svg');
  if (!svg) return;
  const find = highlight.find.trim().toLowerCase();
  const active = Boolean(highlight.kind || find);
  svg.classList.toggle('filtering', active);
  svg.querySelectorAll('[data-fx]').forEach(g => {
    const item = FX[g.dataset.fx];
    if (!item) return;
    const fx = item.fx;
    const kindOk = !highlight.kind || (highlight.kind === 'DB' ? fx.tag === 'READ' || fx.tag === 'WRITE' : fx.tag === highlight.kind);
    const hay = [entityOf(fx), fx.title, ...(fx.fields || []), ...Object.keys(fx.sets || {}), fx.feature || ''].join(' ').toLowerCase();
    const findOk = !find || hay.includes(find);
    g.classList.toggle('hl', active && kindOk && findOk);
  });
}

function render() {
  document.getElementById('title').textContent = SPEC.title;
  const chip = syncChip();
  const chipEl = document.getElementById('sync-chip');
  chipEl.className = `status ${chip.cls}`;
  chipEl.innerHTML = `<span class="dot"></span>${chip.html}`;
  document.getElementById('sync-panel').innerHTML = syncPanel();
  const riskCount = document.getElementById('risk-count');
  riskCount.textContent = RISKS.length ? String(RISKS.length) : '';
  riskCount.hidden = !RISKS.length;
  const svgView = view === 'overview' || view === 'detailed';
  document.getElementById('figure').hidden = !svgView;
  document.getElementById('page').hidden = svgView;
  document.getElementById('copy').hidden = !svgView;
  document.getElementById('copy-md').hidden = !svgView;
  document.getElementById('legend-pop').hidden = !svgView;
  if (svgView) document.getElementById('legend').innerHTML = legendHTML(view);
  // The toolbar holds only what this view uses: block, paths and highlight on Detailed; example runs on Detailed and Model calls.
  const exampleShown = EXAMPLES.length > 0 && ['detailed', 'models'].includes(view);
  ['grp-block', 'grp-paths', 'grp-kinds'].forEach(id => { document.getElementById(id).hidden = view !== 'detailed'; });
  document.getElementById('example-pick').hidden = !exampleShown;
  document.getElementById('toolbar').hidden = view !== 'detailed' && !exampleShown;
  const ex = example();
  const line = document.getElementById('example-line');
  line.hidden = !ex || !['detailed', 'models'].includes(view);
  if (ex) line.innerHTML = `<b>${esc(ex.name)}.</b> ${esc(ex.summary || '')}<small>From ${esc(ex.source || 'an unnamed source')}. Branches it did not take are faded; what it did is in blue.</small>`;
  if (view === 'overview') document.getElementById('diagram').innerHTML = buildOverview('page');
  if (view === 'detailed') document.getElementById('diagram').innerHTML = buildDetailed('page', only);
  if (view === 'data') document.getElementById('page').innerHTML = buildDataPage();
  if (view === 'models') document.getElementById('page').innerHTML = buildModelsPage();
  if (view === 'risks') document.getElementById('page').innerHTML = buildRisksPage();
  document.getElementById('caption').textContent = CAPTIONS[view] || '';
  VIEWS.forEach(v => document.getElementById(`tab-${v}`).setAttribute('aria-selected', String(v === view)));
  applyHighlight();
}
function show(next, opts = {}) {
  view = next;
  if (opts.only !== undefined) { only = opts.only; document.getElementById('only').value = only; }
  if (opts.find !== undefined) { highlight.find = opts.find; document.getElementById('find').value = opts.find; }
  render();
  window.scrollTo({ top: 0 });
}

(function setup() {
  const select = document.getElementById('only');
  select.innerHTML = `<option value="">All blocks</option>` + ORDER.map(id => `<option value="${esc(id)}">${esc(blockLabel(id))}</option>`).join('');
  select.value = only;
  select.addEventListener('change', () => { only = select.value; render(); });
  const names = [...new Set(Object.values(FX).filter(i => i.fx.tag === 'READ' || i.fx.tag === 'WRITE').map(i => entityOf(i.fx)))].sort();
  document.getElementById('entities').innerHTML = names.map(n => `<option value="${esc(n)}"></option>`).join('');
  document.getElementById('find').addEventListener('input', e => { highlight.find = e.target.value; applyHighlight(); });
  document.querySelectorAll('#kinds button').forEach(b => b.addEventListener('click', () => {
    highlight.kind = b.dataset.kind;
    document.querySelectorAll('#kinds button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    applyHighlight();
  }));
  document.querySelectorAll('#paths button').forEach(b => b.addEventListener('click', () => {
    pathsShown = b.dataset.paths;
    document.querySelectorAll('#paths button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    render();
  }));
  document.getElementById('tab-risks').hidden = !RISKS.length;
  const pick = document.getElementById('example');
  pick.innerHTML = `<option value="">None</option>` + EXAMPLES.map(item => `<option value="${esc(item.id)}">${esc(item.name)}</option>`).join('');
  pick.value = exampleId;
  pick.addEventListener('change', () => { exampleId = pick.value; render(); });
  VIEWS.forEach(v => document.getElementById(`tab-${v}`).addEventListener('click', () => show(v)));
  const diagram = document.getElementById('diagram');
  diagram.addEventListener('click', e => {
    const copy = e.target.closest('[data-copy]');
    if (copy) { copyBlock(copy.dataset.copy); return; }
    const block = e.target.closest('[data-block]');
    if (block) { show('detailed', { only: block.dataset.block }); return; }
    const fx = e.target.closest('[data-fx]');
    if (fx) openCard(fx.dataset.fx);
  });
  diagram.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const copy = e.target.closest('[data-copy]');
    const block = e.target.closest('[data-block]');
    const fx = e.target.closest('[data-fx]');
    if (copy || block || fx) e.preventDefault();
    if (copy) copyBlock(copy.dataset.copy);
    else if (block) show('detailed', { only: block.dataset.block });
    else if (fx) openCard(fx.dataset.fx);
  });
  document.getElementById('page').addEventListener('click', e => {
    const model = e.target.closest('[data-model]');
    if (model) { modelFilter = modelFilter === model.dataset.model ? '' : model.dataset.model; hideTip(); render(); return; }
    const jump = e.target.closest('[data-jump]');
    if (jump) { const card = document.getElementById(`e-${jump.dataset.jump}`); if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const goto = e.target.closest('[data-goto]');
    if (goto) { show('detailed', { only: goto.dataset.goto, find: goto.dataset.entity }); return; }
    const showEntity = e.target.closest('[data-show-entity]');
    if (showEntity) { show('detailed', { only: '', find: showEntity.dataset.showEntity }); return; }
    const row = e.target.closest('[data-card]');
    if (row) openCard(row.dataset.card);
  });
  // Chart marks show their numbers on hover and on keyboard focus.
  const page = document.getElementById('page');
  page.addEventListener('pointermove', e => {
    const mark = e.target.closest('[data-tip]');
    if (mark) showTip(mark, e.clientX, e.clientY); else hideTip();
  });
  page.addEventListener('pointerleave', hideTip);
  page.addEventListener('focusin', e => {
    const mark = e.target.closest('[data-tip]');
    if (!mark) return;
    const box = mark.getBoundingClientRect();
    showTip(mark, box.left + Math.min(box.width, 200), box.bottom);
  });
  page.addEventListener('focusout', hideTip);
  document.getElementById('page').addEventListener('input', e => { if (e.target.id === 'table-filter') filterTables(e.target.value); });
  document.getElementById('page').addEventListener('keydown', e => {
    const row = e.target.closest('.call[data-card]');
    if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openCard(row.dataset.card); }
  });
  document.getElementById('copy').addEventListener('click', () => {
    const svg = view === 'overview' ? buildOverview('export') : buildDetailed('export', only);
    copyOut(svg, `Copied the ${view} view. Paste into Figma with Cmd+V.`, 'Copy the selected SVG below, then paste it into Figma.');
  });
  // One block when Detailed shows one; otherwise the whole workflow.
  document.getElementById('copy-md').addEventListener('click', () => {
    if (view === 'detailed' && only) copyBlock(only);
    else copyOut(workflowText(), 'Copied the workflow as Markdown. Paste it into your coding agent.', 'Copy the selected Markdown below.');
  });
})();

// Built with textContent: names come from the workflow and the usage log.
function showTip(mark, x, y) {
  const t = TIPS[mark.dataset.tip];
  const box = document.getElementById('tip');
  if (!t) { hideTip(); return; }
  box.replaceChildren();
  const value = document.createElement('b');
  value.textContent = t.value;
  const title = document.createElement('div');
  title.className = 't';
  title.textContent = t.title;
  const dl = document.createElement('dl');
  (t.rows || []).forEach(([k, v]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v;
    dl.append(dt, dd);
  });
  box.append(value, title, dl);
  box.hidden = false;
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = `${Math.max(8, Math.min(x + 14, innerWidth - w - 8))}px`;
  box.style.top = `${y + 16 + h > innerHeight ? y - h - 12 : y + 16}px`;
}
function hideTip() { document.getElementById('tip').hidden = true; }

// Where the clipboard is blocked, the text goes in a box, selected, to copy by hand.
function copyOut(text, done, manual) {
  const status = document.getElementById('status');
  const fallback = () => {
    const box = document.getElementById('fallback');
    box.hidden = false;
    box.value = text;
    box.focus();
    box.select();
    status.textContent = manual;
  };
  try {
    navigator.clipboard.writeText(text).then(() => { status.textContent = done; }, fallback);
  } catch (err) {
    fallback();
  }
}
function copyBlock(id) {
  const text = id.startsWith('band:') ? workflowText(Number(id.slice(5))) : blockText(id);
  copyOut(text, `Copied ${copyName(id)} as Markdown.`, 'Copy the selected Markdown below.');
}

render();
Promise.all([
  document.fonts.load('600 13.5px "IBM Plex Sans"'),
  document.fonts.load('500 12px "IBM Plex Sans"'),
  document.fonts.load('400 11.5px "IBM Plex Sans"'),
  document.fonts.load('400 10px "IBM Plex Mono"'),
  document.fonts.load('500 11.5px "IBM Plex Mono"'),
]).then(render).catch(() => {});
</script>
